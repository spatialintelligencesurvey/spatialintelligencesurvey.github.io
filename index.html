<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spatial Intelligence Survey — website coming soon.">
  <title>Spatial Intelligence Survey</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d18;
      --surface: rgba(20, 29, 49, 0.72);
      --text: #f4f7ff;
      --muted: #a8b3ca;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(125, 211, 252, 0.15), transparent 32rem),
        radial-gradient(circle at 80% 75%, rgba(167, 139, 250, 0.14), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    main {
      position: relative;
      width: min(720px, calc(100% - 32px));
      padding: clamp(36px, 7vw, 72px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5.25rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(110deg, var(--accent), var(--accent-2));
      background-clip: text;
      -webkit-background-clip: text;
    }

    .description {
      max-width: 520px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 34px;
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #dbe4f5;
      background: rgba(255, 255, 255, 0.045);
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      main { border-radius: 22px; }
      h1 { font-size: clamp(2.4rem, 14vw, 4rem); }
      .description br { display: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      main { animation: arrive 700ms ease-out both; }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(14px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Coming soon</p>
    <h1>Spatial<br><span>Intelligence</span></h1>
    <p class="description">
      A survey of research, benchmarks, and emerging ideas<br>
      in spatial intelligence.
    </p>
    <div class="status">Website under construction</div>
  </main>
</body>
</html>
